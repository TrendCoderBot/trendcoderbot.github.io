<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrendCoder — Trend-following trading bot for MetaTrader 5</title>
<meta name="description" content="TrendCoder is a trend-following trading bot for MetaTrader 5. Four H4 strategies on gold, silver, Bitcoin and Ethereum with built-in risk management.">
<link rel="icon" href="trendcoder.ico">
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --line:#1f262e; --text:#e8ecf1; --muted:#9aa5b1;
    --gold:#e2b04a; --gold2:#f3cf7a; --green:#3ecf8e; --red:#ef6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* header */
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.3px}
  .logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#a8781f);display:grid;place-items:center}
  .logo-mark svg{width:18px;height:18px}
  .nav-links{display:flex;gap:28px;color:var(--muted);font-size:15px}
  .nav-links a:hover{color:var(--text)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:6px 9px;font-size:13px;cursor:pointer;font-weight:600}
  .lang button.on{background:var(--panel);color:var(--gold2)}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;transition:.15s}
  .btn-gold{background:var(--gold);color:#16120a}
  .btn-gold:hover{background:var(--gold2)}
  .btn-ghost{border-color:var(--line);color:var(--text)}
  .btn-ghost:hover{border-color:#36414d}
  .btn-sm{padding:8px 14px;font-size:14px}

  /* hero */
  .hero{padding:88px 0 72px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
  .eyebrow{display:inline-block;color:var(--gold2);font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:18px}
  h1{font-size:50px;line-height:1.1;letter-spacing:-1px;margin-bottom:20px}
  h1 em{font-style:normal;color:var(--gold)}
  .lead{color:var(--muted);font-size:18px;max-width:520px;margin-bottom:32px}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}

  /* chart card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .chart{padding:20px}
  .chart-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px}
  .chart-top b{font-size:15px}
  .tag{font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(62,207,142,.12);color:var(--green);font-weight:600}
  .chart svg{width:100%;height:auto;display:block}
  .chart-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .mini{background:#0e1216;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .mini span{display:block;font-size:12px;color:var(--muted)}
  .mini b{font-size:15px}
  .note{font-size:12px;color:#6c7783;margin-top:10px}

  section{padding:80px 0;border-top:1px solid var(--line)}
  .sec-head{max-width:640px;margin-bottom:44px}
  h2{font-size:34px;letter-spacing:-.5px;line-height:1.2;margin-bottom:12px}
  .sec-head p{color:var(--muted);font-size:17px}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .feat{padding:24px}
  .ico{width:40px;height:40px;border-radius:10px;background:rgba(226,176,74,.12);display:grid;place-items:center;margin-bottom:16px}
  .ico svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .feat h3{font-size:17px;margin-bottom:6px}
  .feat p{color:var(--muted);font-size:15px}

  .steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .step{padding:24px;position:relative}
  .step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);color:var(--gold2);font-weight:700;font-size:14px;margin-bottom:14px}
  .step h3{font-size:16px;margin-bottom:6px}
  .step p{color:var(--muted);font-size:14.5px}

  .req{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .req ul{list-style:none;padding:24px}
  .req li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;color:var(--muted);font-size:15px}
  .req li:last-child{border:0}
  .req li b{color:var(--text);font-weight:600}
  .req h3{padding:24px 24px 0;font-size:17px}

  .buy{padding:48px;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;background:linear-gradient(135deg,#15120a,#12161b 55%)}
  .buy h2{margin-bottom:10px}
  .buy p{color:var(--muted)}
  .buy-box{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .buy-box .btn{justify-content:center;padding:15px 20px}
  .buy-small{font-size:13px;color:#6c7783;text-align:center}

  .faq details{border-bottom:1px solid var(--line);padding:18px 0}
  .faq summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between}
  .faq summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
  .faq details[open] summary::after{content:"–"}
  .faq details p{color:var(--muted);margin-top:10px;font-size:15px;max-width:820px}

  footer{border-top:1px solid var(--line);padding:40px 0 48px;color:#6c7783;font-size:13px}
  .risk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:16px 18px;margin-bottom:28px;color:var(--muted);font-size:13.5px}
  .risk b{color:var(--text)}
  .foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;padding:56px 0 48px;gap:36px}
    h1{font-size:38px}
    .grid4,.steps{grid-template-columns:1fr 1fr}
    .grid3,.req,.buy{grid-template-columns:1fr}
    .nav-links{display:none}
    .buy{padding:28px}
  }
  @media (max-width:560px){
    .grid4,.steps{grid-template-columns:1fr}
    .nav-right .btn{display:none}
  }
</style>
</head>

function dilUygula(l){
  const d = T[l] || T.en;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v = d[el.dataset.i]; if(v!==undefined) el.innerHTML = v;
  });
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on", b.dataset.l===l));
  try{ localStorage.setItem("tc_lang", l); }catch(e){}
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>dilUygula(b.dataset.l));
document.querySelectorAll(".tg").forEach(a=>{ a.href="https://t.me/"+TELEGRAM_KULLANICI; a.target="_blank"; a.rel="noopener"; });
document.getElementById("yil").textContent = new Date().getFullYear();

try{
  const k = localStorage.getItem("tc_lang");
  if(k && T[k]) ilk = k;
  else { const n=(navigator.language||"en").slice(0,2); if(T[n]) ilk = n; }
}catch(e){}
dilUygula(ilk);
</script>
